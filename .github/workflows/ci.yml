name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        directory: [".", "acp-bridge"]
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.directory }}" = "." ]; then
            pip install -r requirements-dev.txt
          else
            pip install -e ".[dev]"
          fi
      - name: Validate configuration
        if: matrix.directory == '.'
        run: python config/validate.py
      - name: Run tests
        run: pytest -q

      - name: Offline eval gate
        run: python scripts/run_evals.py routing --baseline --enforce-thresholds
