# RING model gateway
# Docs: https://docs.litellm.ai/docs/config/yaml
model_list:
  - model_name: persona-chat
    litellm_params:
      model: openai/gemini-3.8-flash
      api_base: os.environ/AGT_BASE_URL
      api_key: os.environ/AGT_API_KEY
  - model_name: persona-trigger
    litellm_params:
      model: openai/gemini-3.8-flash
      api_base: os.environ/AGT_BASE_URL
      api_key: os.environ/AGT_API_KEY
  - model_name: coding-primary
    litellm_params:
      model: openai/gemini-3.8-flash
      api_base: os.environ/AGT_BASE_URL
      api_key: os.environ/AGT_API_KEY
  - model_name: coding-fallback
    litellm_params:
      model: openai/gemini-3.8-flash
      api_base: os.environ/AGT_BASE_URL
      api_key: os.environ/AGT_API_KEY
  - model_name: intent-router
    litellm_params:
      model: openai/gemini-3.8-flash
      api_base: os.environ/AGT_BASE_URL
      api_key: os.environ/AGT_API_KEY

router_settings:
  routing_strategy: simple-shuffle
  num_retries: 2
  timeout: 300
  fallbacks:
    - coding-primary: [coding-fallback]

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY

litellm_settings:
  drop_params: true
  success_callback: ["langfuse"]
  failure_callback: ["langfuse"]
