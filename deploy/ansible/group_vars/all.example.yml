# 复制为 group_vars/all.yml 后填写。
# 密钥建议用 ansible-vault 加密：ansible-vault encrypt group_vars/all.yml
# 本文件不含任何真实密钥。
---
# ---- 账号与目录 ----
ring_user: ring
ring_group: ring
ring_base: /opt/ring          # 与生产一致：app/data/tools/toolenv/backup 都在这里
ring_repo_url: https://github.com/Names233/RING.git
ring_repo_version: master     # 生产用具体 commit/tag 更稳
ring_python: python3

# ---- 版本（钉死）----
maibot_version: "1.3.19"
openviking_version: "0.5.3"
uv_version: "0.5.5"
docker_compose_version: "v2.29.7"

# ---- 监听 ----
ring_bind_host: 127.0.0.1     # 裸机默认只回环；前面放 Caddy
openviking_port: 1933
openviking_service_port: 18080
persona_port: 18081
router_port: 18082
maibot_webui_port: 8001
maibot_ws_port: 8000
maibot_api_port: 8090
napcat_onebot_port: 3001
napcat_webui_port: 6099

# ---- systemd 资源上限（2G 机器，与生产对齐）----
ring_cloud_memory_max: 180M
ring_cloud_cpu_quota: 30%
openviking_memory_max: 640M
openviking_memory_swap_max: 500M
maibot_memory_max: 700M
maibot_memory_swap_max: 700M

# ---- OpenViking ----
ov_root_api_key: "CHANGE_ME"       # openssl rand -hex 24
ov_embedding_model: qwen3-text-embedding
ov_embedding_api_key: "CHANGE_ME"
ov_embedding_api_base: https://your-embedding-endpoint/v1
ov_embedding_dimension: 1024
ov_rerank_model: qwen3-text-rerank
ov_rerank_api_key: "CHANGE_ME"
ov_rerank_api_base: https://your-rerank-endpoint/api/v1/services/rerank/text-rerank
ov_rerank_threshold: 0.1
ov_vlm_model: gemini-3.8-flash
ov_vlm_api_key: "CHANGE_ME"
ov_vlm_api_base: https://your-vlm-endpoint/v1
ov_vlm_temperature: 0.0
ov_vlm_max_tokens: 4096

# ---- ring-cloud 模型网关 ----
agt_base_url: http://127.0.0.1:8045/v1
agt_api_key: "CHANGE_ME"
agt_model: gemini-3.8-flash
agt_timeout_seconds: "20.0"
heartbeat_secret_token: "CHANGE_ME"   # openssl rand -hex 24
acp_bridge_url: http://127.0.0.1:18090
airi_embodiment_url: http://127.0.0.1:18092
ring_offline_mode: "0"

# ---- NapCat（容器跑在裸机上，与当前生产一致）----
napcat_image: mlikiowa/napcat-docker:latest
napcat_uid: 1000
napcat_gid: 1000

# ---- Caddy 反代 ----
caddy_enabled: true
caddy_email: you@example.com
ov_domain: ov.example.com
mb_domain: mb.example.com

# ---- 备份 ----
backup_enabled: true
backup_oncalendar: "*-*-* 04:10:00"
backup_timezone: Asia/Shanghai
backup_paths: "openviking maibot napcat/config caddy"
backup_keep: 14
dav_base: ""
dav_user: ""
dav_pass: ""
# 备份口令：留空则由 playbook 首次运行随机生成并写入 {ring_base}/backup/.passphrase
backup_passphrase: ""

# ---- 可选：QQ 适配器插件（仓库外）----
# 把 snowluma adapter 插件目录放到控制机的这个路径，role 会 rsync 到 maibot/plugins/
snowluma_adapter_src: ""
