---
- name: 部署 ring-cloud.service
  ansible.builtin.template:
    src: ring-cloud.service.j2
    dest: /etc/systemd/system/ring-cloud.service
    mode: "0644"
  notify: [reload systemd, restart ring-cloud]

- name: 启动 ring-cloud
  ansible.builtin.systemd_service:
    name: ring-cloud
    enabled: true
    state: started
    daemon_reload: true
