[project]
name = "digital-genesis-acp-bridge"
version = "0.1.0"
description = "ACP <-> A2A bridge for Digital Genesis"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "pydantic>=2.9",
  "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "jsonschema>=4.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
